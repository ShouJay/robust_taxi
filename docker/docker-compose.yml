services:
  mongodb:
    image: mongo:7.0
    container_name: smart_taxi_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smart_taxi_ads
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart_taxi_network

  emqx:
    image: emqx/emqx:5.8
    container_name: smart_taxi_emqx
    restart: always
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    environment:
      EMQX_ALLOW_ANONYMOUS: ${EMQX_ALLOW_ANONYMOUS:-true}
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart_taxi_network

  smart_taxi_service:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: smart_taxi_service
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - DATABASE_NAME=smart_taxi_ads
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-development-only-secret-key}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8080
      - FLASK_DEBUG=False
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - UPLOAD_ROOT=/app/uploads
    command: gunicorn -w 2 -b 0.0.0.0:8080 src.app:app --access-logfile - --error-logfile -
    volumes:
      - video_data:/app/uploads
    networks:
      - smart_taxi_network

  mqtt_worker:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: smart_taxi_mqtt_worker
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - DATABASE_NAME=smart_taxi_ads
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
    command: python run_mqtt_worker.py
    healthcheck:
      disable: true
    networks:
      - smart_taxi_network

volumes:
  mongodb_data:
  video_data:
  emqx_data:

networks:
  smart_taxi_network:
    driver: bridge
